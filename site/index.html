<!doctype html>
<html lang="pt-BR" data-theme="obsidiana">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Gemóvel</title>
  <link rel="icon" href="estaticos/favicon.svg" type="image/svg+xml">
  <script>
    /* Nível de efeito (DESIGN.md §6), antes do CSS: leve, completo ou padrão. ?nivel= força o nível na aba. */
    (function () {
      var raiz = document.documentElement, nav = navigator, nivel = null;
      var pedido = new URLSearchParams(location.search).get("nivel");
      try {
        if (pedido) sessionStorage.setItem("gemovel:nivel", pedido);
        nivel = sessionStorage.getItem("gemovel:nivel");
      } catch (e) { nivel = pedido; }
      if (["completo", "padrao", "leve"].indexOf(nivel) < 0) {
        var leve = (nav.deviceMemory && nav.deviceMemory <= 4) || (nav.hardwareConcurrency && nav.hardwareConcurrency <= 4) ||
          (nav.connection && nav.connection.saveData) || matchMedia("(prefers-reduced-transparency: reduce)").matches ||
          !(window.CSS && CSS.supports("backdrop-filter", "blur(1px)"));
        var marcas = (nav.userAgentData && nav.userAgentData.brands) || [];
        var chromium = marcas.some(function (m) { return m.brand === "Chromium"; });
        var computador = matchMedia("(pointer: fine)").matches && !(nav.userAgentData && nav.userAgentData.mobile);
        nivel = leve ? "leve" : (chromium && computador ? "completo" : "padrao");
      }
      if (raiz.dataset.theme === "quartzo" && nivel === "completo") nivel = "padrao";
      raiz.dataset.tier = nivel;
    })();
  </script>
  
<link rel="preload" href="estaticos/fontes/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="estaticos/fontes/bodoni-moda-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="estaticos/css/admin.css">
<link rel="stylesheet" href="estaticos/css/telas/entrar.css">

  
  <meta name="gemovel-modo" content="demo">
  <link rel="stylesheet" href="estaticos/css/demo.css">
  <script type="module" src="estaticos/js/demo/navegador.js"></script>
  
</head>
<body>
  <a class="pular-para-conteudo" href="#conteudo">Pular para o conteúdo</a>
  
<div class="entrar">
  <header class="palco">
    <svg class="palco__defs" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="prisma" x1="3" y1="4" x2="21" y2="20.5" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#a6f4ff"/><stop offset=".38" stop-color="#cdbcff"/>
          <stop offset=".7" stop-color="#ffb8e3"/><stop offset="1" stop-color="#ffe2a6"/>
        </linearGradient>
        <symbol id="gema-palco" viewBox="0 0 24 24">
          <path class="palco__lapide" d="M7 4H17L21 9.5L12 20.5L3 9.5Z"/>
          <path class="palco__facetas" d="M3 9.5H21M7 4L9.5 9.5L12 4L14.5 9.5L17 4M9.5 9.5L12 20.5L14.5 9.5"/>
        </symbol>
      </defs>
    </svg>
    <p class="palco__etiqueta" aria-hidden="true">Gestão de temporada</p>
    <h1 class="palco__nome display-xl" data-nome="Gemóvel">Gemóvel</h1>
    <div class="palco__gemas" aria-hidden="true">
      
      <span class="palco__gema" style="--x: 62%; --y: 16%; --t: 136px; --prof: 1; --dur: 8s; --i: 0">
        <svg viewBox="0 0 24 24" focusable="false"><use href="#gema-palco"></use></svg>
      </span>
      
      <span class="palco__gema" style="--x: 84%; --y: 44%; --t: 64px; --prof: 0.6; --dur: 7s; --i: 1">
        <svg viewBox="0 0 24 24" focusable="false"><use href="#gema-palco"></use></svg>
      </span>
      
      <span class="palco__gema" style="--x: 71%; --y: 70%; --t: 40px; --prof: 0.35; --dur: 9s; --i: 2">
        <svg viewBox="0 0 24 24" focusable="false"><use href="#gema-palco"></use></svg>
      </span>
      
      <span class="palco__gema" style="--x: 20%; --y: 56%; --t: 92px; --prof: 0.8; --dur: 6.5s; --i: 3">
        <svg viewBox="0 0 24 24" focusable="false"><use href="#gema-palco"></use></svg>
      </span>
      
      <span class="palco__gema" style="--x: 46%; --y: 36%; --t: 28px; --prof: 0.25; --dur: 7.5s; --i: 4">
        <svg viewBox="0 0 24 24" focusable="false"><use href="#gema-palco"></use></svg>
      </span>
      
      <span class="palco__gema" style="--x: 38%; --y: 80%; --t: 52px; --prof: 0.5; --dur: 8.5s; --i: 5">
        <svg viewBox="0 0 24 24" focusable="false"><use href="#gema-palco"></use></svg>
      </span>
      
    </div>
    <div class="palco__faixa" aria-hidden="true">
      <div class="palco__trilho">
        
        <span>Entrada 15:00 · Saída 11:00 · Limpeza entre estadias · Reservas sem conflito ·</span>
        
        <span>Entrada 15:00 · Saída 11:00 · Limpeza entre estadias · Reservas sem conflito ·</span>
        
      </div>
    </div>
  </header>
  <main id="conteudo" class="entrar__lado">
    <section class="cartao entrar__painel" aria-labelledby="entrar-titulo">
      <h2 class="display-md" id="entrar-titulo">Entrar</h2>
      <div class="entrar__avisos" data-entrar-avisos></div>
      <form class="formulario" id="form-entrar" novalidate>
        <div class="campo">
          <label class="campo__rotulo" for="email">E-mail</label>
          <input class="entrada" id="email" name="email" type="email" autocomplete="username" autocapitalize="off"
                 spellcheck="false" required data-obrigatorio="Preencha o e-mail.">
        </div>
        <div class="campo">
          <label class="campo__rotulo" for="senha">Senha</label>
          <div class="controle">
            <input class="entrada" id="senha" name="senha" type="password" autocomplete="current-password"
                   data-tipo="senha" required data-obrigatorio="Preencha a senha.">
            <button type="button" class="botao botao--sm botao--fantasma" data-mostrar aria-controls="senha">
              <svg class="icone" aria-hidden="true" focusable="false"><use href="estaticos/icones.svg#mostrar"></use></svg>
              <span data-mostrar-rotulo>Mostrar</span>
            </button>
          </div>
        </div>
        <button type="submit" class="botao botao--primario botao--lg botao--largo" data-enviando="Entrando…">
          <span class="botao__rotulo">Entrar</span>
        </button>
      </form>
      <p class="entrar__ajuda">Esqueceu a senha? Peça para quem administra redefinir.</p>
    </section>
  </main>
</div>

  <script type="module" src="estaticos/js/telas/entrar.js"></script>
</body>
</html>
