{% extends "admin/base-admin.html" %}
{% set tela = "equipe" %}
{% block titulo %}Equipe · Gemóvel{% endblock %}
{% block css %}{{ super() }}<link rel="stylesheet" href="/estaticos/css/telas/equipe.css">{% endblock %}
{% macro icone(id) %}<svg class="icone" aria-hidden="true" focusable="false"><use href="/estaticos/icones.svg#{{ id }}"></use></svg>{% endmacro %}
{% block principal %}
<div class="cabecalho">
  <div class="cabecalho__textos">
    <h1 class="cabecalho__titulo">Equipe</h1>
    <p class="cabecalho__contexto numero" data-contexto></p>
  </div>
  <div class="cabecalho__acoes">
    <button type="button" class="botao botao--primario" data-novo>{{ icone("mais") }}<span class="botao__rotulo">Nova pessoa</span></button>
  </div>
</div>

<div class="filtros">
  <button type="button" class="botao botao--secundario filtro" data-filtro="funcao">Função: <span class="filtro__valor">Todas</span>{{ icone("abrir") }}</button>
  <button type="button" class="botao botao--fantasma botao--sm filtros__limpar" data-limpar hidden>Limpar filtros</button>
  <label class="escolha filtros__interruptor"><input type="checkbox" role="switch" data-desativadas>Mostrar desativadas</label>
</div>
<div data-lista></div>
{% endblock %}
{% block scripts %}<script type="module" src="/estaticos/js/telas/equipe.js"></script>{% endblock %}
