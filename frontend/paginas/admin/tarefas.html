{% extends "admin/base-admin.html" %}
{% set tela = "tarefas" %}
{% block titulo %}Tarefas · Gemóvel{% endblock %}
{% block css %}{{ super() }}<link rel="stylesheet" href="/estaticos/css/telas/tarefas.css">{% endblock %}
{% macro icone(id) %}<svg class="icone" aria-hidden="true" focusable="false"><use href="/estaticos/icones.svg#{{ id }}"></use></svg>{% endmacro %}
{% block principal %}
<div class="cabecalho">
  <div class="cabecalho__textos">
    <h1 class="cabecalho__titulo">Tarefas</h1>
    <p class="cabecalho__contexto numero" data-contexto></p>
  </div>
  <div class="cabecalho__acoes">
    <button type="button" class="botao botao--primario" data-novo>{{ icone("mais") }}<span class="botao__rotulo">Nova tarefa</span></button>
  </div>
</div>

<div class="filtros">
  <div data-periodo></div>
  <button type="button" class="botao botao--secundario filtro" data-filtro="tipo">Tipo: <span class="filtro__valor">Todos</span>{{ icone("abrir") }}</button>
  <button type="button" class="botao botao--secundario filtro" data-filtro="responsavel">Responsável: <span class="filtro__valor">Todos</span>{{ icone("abrir") }}</button>
  <button type="button" class="botao botao--secundario filtro" data-filtro="imovel">Imóvel: <span class="filtro__valor">Todos</span>{{ icone("abrir") }}</button>
  <button type="button" class="botao botao--fantasma botao--sm filtros__limpar" data-limpar hidden>Limpar filtros</button>
</div>
<div class="tarefas-do-dia" data-lista></div>
{% endblock %}
{% block scripts %}<script type="module" src="/estaticos/js/telas/tarefas.js"></script>{% endblock %}
